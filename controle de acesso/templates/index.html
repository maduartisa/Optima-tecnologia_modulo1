<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Ambientes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button.delete {
            background: #e74c3c;
            width: auto;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        button.delete:hover {
            background: #c0392b;
        }

        button.edit {
            background: #f39c12;
            width: auto;
            padding: 8px 15px;
            font-size: 0.9em;
            margin-right: 5px;
        }

        button.edit:hover {
            background: #d68910;
        }

        .ambientes-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ambiente-card {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .ambiente-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .ambiente-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .ambiente-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .info-item {
            color: #555;
        }

        .info-label {
            font-weight: 600;
            color: #333;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .badge.nivel-1 { background: #2ecc71; }
        .badge.nivel-2 { background: #f39c12; }
        .badge.nivel-3 { background: #e74c3c; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .ambiente-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Sistema de Controle de Ambientes</h1>
            <p>Gerenciar ambientes, níveis de acesso e zonas comerciais</p>
        </header>

        <div class="content">
            <!-- FORMULÁRIO -->
            <div class="section">
                <h2>➕ Novo Ambiente</h2>
                <div id="formMessage" class="message"></div>
                <form id="ambienteForm">
                    <div class="form-group">
                        <label for="nome">Nome do Ambiente *</label>
                        <input type="text" id="nome" required placeholder="Ex: Loja 01">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" required>
                            <option value="">Selecione...</option>
                            <option value="Loja">Loja</option>
                            <option value="Sala Comercial">Sala Comercial</option>
                            <option value="Entretenimento">Entretenimento</option>
                            <option value="Administrativo">Administrativo</option>
                            <option value="Técnico">Técnico</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="andar">Andar *</label>
                        <input type="text" id="andar" required placeholder="Ex: Térreo, 1º Andar">
                    </div>

                    <div class="form-group">
                        <label for="zona">Zona *</label>
                        <select id="zona" required>
                            <option value="">Selecione...</option>
                            <option value="Comercial">Comercial</option>
                            <option value="Privativa">Privativa</option>
                            <option value="Lazer">Lazer</option>
                            <option value="Serviço">Serviço</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="nivel_acesso">Nível de Acesso *</label>
                        <select id="nivel_acesso" required>
                            <option value="">Selecione...</option>
                            <option value="1">1 - Público</option>
                            <option value="2">2 - Semi-Restrito</option>
                            <option value="3">3 - Restrito</option>
                        </select>
                    </div>

                    <button type="submit">Criar Ambiente</button>
                </form>
            </div>

            <!-- LISTAGEM -->
            <div class="section">
                <h2>📋 Ambientes Cadastrados</h2>
                <div id="listMessage" class="message"></div>
                <div id="ambientesList" class="ambientes-list">
                    <div class="empty-state">Carregando ambientes...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/ambientes';

        // Carregar ambientes ao iniciar
        document.addEventListener('DOMContentLoaded', () => {
            carregarAmbientes();
        });

        // Enviar formulário
        document.getElementById('ambienteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const novoAmbiente = {
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('categoria').value,
                andar: document.getElementById('andar').value,
                zona: document.getElementById('zona').value,
                nivel_acesso: parseInt(document.getElementById('nivel_acesso').value)
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novoAmbiente)
                });

                if (response.ok) {
                    mostrarMensagem('Ambiente criado com sucesso!', 'success', 'formMessage');
                    document.getElementById('ambienteForm').reset();
                    carregarAmbientes();
                } else {
                    const erro = await response.json();
                    mostrarMensagem('Erro: ' + erro.erro, 'error', 'formMessage');
                }
            } catch (error) {
                mostrarMensagem('Erro ao conectar com servidor', 'error', 'formMessage');
            }
        });

        // Carregar lista de ambientes
        async function carregarAmbientes() {
            try {
                const response = await fetch(API_URL);
                const ambientes = await response.json();

                const lista = document.getElementById('ambientesList');
                
                if (ambientes.length === 0) {
                    lista.innerHTML = '<div class="empty-state">Nenhum ambiente cadastrado</div>';
                    return;
                }

                lista.innerHTML = ambientes.map(amb => `
                    <div class="ambiente-card">
                        <h3>${amb.nome}</h3>
                        <span class="badge nivel-${amb.nivel_acesso}">Nível ${amb.nivel_acesso}</span>
                        
                        <div class="ambiente-info">
                            <div class="info-item">
                                <span class="info-label">Categoria:</span> ${amb.categoria}
                            </div>
                            <div class="info-item">
                                <span class="info-label">Andar:</span> ${amb.andar}
                            </div>
                            <div class="info-item">
                                <span class="info-label">Zona:</span> ${amb.zona}
                            </div>
                            <div class="info-item">
                                <span class="info-label">ID:</span> #${amb.id}
                            </div>
                        </div>

                        <div class="actions">
                            <button class="delete" onclick="deletarAmbiente(${amb.id})">🗑️ Deletar</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('ambientesList').innerHTML = 
                    '<div class="empty-state">Erro ao carregar ambientes</div>';
            }
        }

        // Deletar ambiente
        async function deletarAmbiente(id) {
            if (!confirm('Tem certeza que deseja deletar este ambiente?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    mostrarMensagem('Ambiente deletado com sucesso!', 'success', 'listMessage');
                    carregarAmbientes();
                } else {
                    const erro = await response.json();
                    mostrarMensagem('Erro: ' + erro.erro, 'error', 'listMessage');
                }
            } catch (error) {
                mostrarMensagem('Erro ao deletar ambiente', 'error', 'listMessage');
            }
        }

        // Mostrar mensagens
        function mostrarMensagem(texto, tipo, elementId) {
            const elemento = document.getElementById(elementId);
            elemento.textContent = texto;
            elemento.className = `message ${tipo} show`;
            
            setTimeout(() => {
                elemento.classList.remove('show');
            }, 3000);
        }

        // Recarregar a cada 5 segundos
        setInterval(carregarAmbientes, 5000);
    </script>
</body>
</html>
